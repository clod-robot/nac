server:
  port: 8081

spring:
  application:
    name: nac-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        # Nacos 已开启鉴权，客户端必须携带账号口令，否则注册/心跳会 403
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:Nacos@a3T6PLeR8bVFHAhgtd}
        namespace: ${NACOS_NAMESPACE:public}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:nac}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    # 连接池显式配置：避免默认 maxActive=8 偏小与坏连接流入业务
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 5000
      test-while-idle: true
      test-on-borrow: false
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 必须同时声明用户名：Lettuce 6.x 的 RESP3 握手仅在存在 username 时才会在 HELLO 中携带 AUTH，
      # 只配 password 会发送裸 HELLO 3 被 Redis 拒绝(NOAUTH)。Redis 6+ 默认用户名为 default。
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:hipXkCn4on2Yr8QgPyBT8TEGNUnN_a3_}
      timeout: 3000ms
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:127.0.0.1:9093}
    producer:
      acks: 1
      properties:
        max.block.ms: 3000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

nac:
  jwt:
    secret: ${JWT_SECRET:NacJwtSecret@2026-Phase1-ChangeMe}
    expire-seconds: 28800
  crypto:
    phone-password: ${PHONE_CRYPTO_PASSWORD:NcePhone@2026}
  gateway:
    trust-enabled: ${GATEWAY_TRUST_ENABLED:true}
    internal-secret: ${NAC_INTERNAL_SECRET:NacInternal@2026-Gw2Svc}
  sms:
    provider: ${SMS_PROVIDER:mock}   # mock | aliyun | tencent | huawei
    aliyun:
      access-key-id: ${ALIYUN_SMS_AK:}
      access-key-secret: ${ALIYUN_SMS_SK:}
      sign-name: ${ALIYUN_SMS_SIGN:NAC准入}
      template-code: ${ALIYUN_SMS_TEMPLATE:}
    tencent:
      secret-id: ${TENCENT_SMS_AK:}
      secret-key: ${TENCENT_SMS_SK:}
      sms-sdk-app-id: ${TENCENT_SMS_APPID:}
      sign-name: ${TENCENT_SMS_SIGN:NAC准入}
      template-id: ${TENCENT_SMS_TEMPLATE:}
    huawei:
      app-key: ${HUAWEI_SMS_AK:}
      app-secret: ${HUAWEI_SMS_SK:}
      sender: ${HUAWEI_SMS_SENDER:}
      template-id: ${HUAWEI_SMS_TEMPLATE:}
      url: ${HUAWEI_SMS_URL:https://smsapi.cn-north-4.myhuaweicloud.com:443/sms/batchSendSms/v1}

logging:
  level:
    root: WARN
    com.nac: WARN          # 业务日志：仅 WARN/ERROR 输出到 journald；排障时临时改 INFO/DEBUG，重启生效
    org.springframework: WARN
    com.alibaba.druid: WARN
