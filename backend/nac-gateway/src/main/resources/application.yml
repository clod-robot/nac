server:
  port: 8080

spring:
  application:
    name: nac-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    # Nacos 服务发现：网关与各业务服务均注册到 Nacos，路由用 lb:// 按服务名转发
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
    # Spring Cloud Gateway (WebFlux) 路由
    gateway:
      routes:
        - id: nac-auth
          uri: lb://nac-auth
          predicates:
            - Path=/api/auth/**,/api/portal/**,/free-auth/**
        - id: nac-user
          uri: lb://nac-user
          predicates:
            - Path=/api/user/**,/api/device/**
        - id: nac-radius
          uri: lb://nac-radius
          predicates:
            - Path=/api/radius/**
        - id: nac-log
          uri: lb://nac-log
          predicates:
            - Path=/api/log/**

nac:
  gateway:
    internal-secret: ${NAC_INTERNAL_SECRET:NacInternal@2026-Gw2Svc}
    # 白名单由 AuthGlobalFilter 默认值定义（含 login/captcha/sms/portal-auth），
    # 如需覆盖请配置为逗号分隔字符串：nac.gateway.whitelist

logging:
  level:
    com.nac: INFO
