server:
  port: 8082

spring:
  application:
    name: nac-user
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:nac}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 5000
      test-while-idle: true
      test-on-borrow: false
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # Redis 8 默认 RESP3：HELLO 握手需同时携带用户名，否则报 NOAUTH
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:hipXkCn4on2Yr8QgPyBT8TEGNUnN_a3_}
      timeout: 3000ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

nac:
  gateway:
    trust-enabled: ${GATEWAY_TRUST_ENABLED:true}
    internal-secret: ${NAC_INTERNAL_SECRET:NacInternal@2026-Gw2Svc}

logging:
  level:
    root: WARN
    com.nac: WARN          # 业务日志：仅 WARN/ERROR 输出到 journald；排障时临时改 INFO/DEBUG，重启生效
    org.springframework: WARN
    com.alibaba.druid: WARN
